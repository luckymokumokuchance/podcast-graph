<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CONTACT｜ラッキーもくもくチャンス</title>
<meta name="description" content="ラッキーもくもくチャンスへのお便りはこちらから。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="page.css">
<style>
  /* CONTACTページ専用の追加スタイル（page.cssは変更せず、ここに自己完結で追加） */
  .cloud.contact-cloud {
    width: calc(657 * var(--u));
    max-width: 92vw;
  }

  .contact-title {
    margin: 0;
    font-size: clamp(15px, calc(19 * var(--u)), 22px);
    font-weight: 700;
    letter-spacing: .04em;
  }

  .contact-title .em { color: var(--green); }

  .contact-intro {
    margin: 0 0 clamp(2px, .6vmin, 6px);
    text-align: center;
    font-size: clamp(10px, calc(12 * var(--u)), 13px);
    line-height: 1.7;
    color: var(--ink);
    opacity: .85;
  }

  .contact-form {
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 1.6vmin, 14px);
    width: 100%;
    max-width: 420px;
  }

  .field { display: flex; flex-direction: column; gap: 4px; }

  .field label {
    font-size: clamp(10px, calc(11 * var(--u)), 12px);
    font-weight: 700;
    letter-spacing: .04em;
  }

  .field label .req {
    color: var(--green);
    margin-left: 2px;
    font-weight: 700;
  }

  .field input,
  .field textarea {
    font-family: inherit;
    font-size: clamp(11px, calc(12 * var(--u)), 14px);
    padding: 8px 10px;
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    background: rgba(255,255,255,.75);
    color: var(--ink);
    resize: vertical;
  }

  .field textarea { min-height: 5em; }

  .field input:focus,
  .field textarea:focus {
    outline: none;
    border-color: var(--green);
    background: rgba(255,255,255,.92);
  }

  .contact-submit {
    align-self: center;
    margin-top: 2px;
    padding: 8px 28px;
    font-family: inherit;
    font-size: clamp(11px, calc(13 * var(--u)), 14px);
    font-weight: 700;
    letter-spacing: .08em;
    color: #fff;
    background: var(--green);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: opacity .18s ease, transform .12s ease;
  }

  .contact-submit:hover { opacity: .88; }
  .contact-submit:active { transform: scale(.97); }
  .contact-submit:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .contact-submit[disabled] { opacity: .5; cursor: default; }

  .contact-note {
    margin: 0;
    text-align: center;
    font-size: clamp(9px, calc(10 * var(--u)), 11px);
    color: var(--ink);
    opacity: .6;
  }

  /* 送信完了メッセージ */
  .contact-thanks {
    display: none;
    text-align: center;
    gap: clamp(8px, 1.6vmin, 14px);
    flex-direction: column;
    align-items: center;
  }

  .contact-thanks .big {
    font-size: clamp(15px, calc(18 * var(--u)), 21px);
    font-weight: 700;
    color: var(--green);
  }

  .contact-thanks p {
    margin: 0;
    font-size: clamp(11px, calc(12 * var(--u)), 13px);
    line-height: 1.8;
  }

  .is-sent .contact-form,
  .is-sent .contact-intro { display: none; }
  .is-sent .contact-thanks { display: flex; }
</style>
</head>
<body>
<main class="stage">
  <div class="cloud contact-cloud" id="cloud">
    <h1 class="contact-title"><span class="em">お便り</span>フォーム</h1>
    <p class="contact-intro">
      感想・リクエスト・雑談、なんでもお気軽にどうぞ。<br>
      いただいた内容は番組内で紹介させていただく場合があります。
    </p>

    <form class="contact-form" id="contactForm"
          action="https://docs.google.com/forms/d/e/1FAIpQLSf3bsrpPftzvITWi7wwMyhyFHFmH44mDJ6RSp9sGkXXKDCsOg/formResponse"
          method="POST" target="hidden_iframe">

      <div class="field">
        <label for="name">ラジオネーム<span class="req">*</span></label>
        <input type="text" id="name" name="entry.1990855270" required autocomplete="off">
      </div>

      <div class="field">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="entry.1973934207" autocomplete="off">
      </div>

      <div class="field">
        <label for="body">本文<span class="req">*</span></label>
        <textarea id="body" name="entry.662891078" required></textarea>
      </div>

      <button type="submit" class="contact-submit" id="submitBtn">送信する</button>
      <p class="contact-note">※ 送信内容はGoogleフォーム経由で運営に届きます</p>
    </form>

    <div class="contact-thanks">
      <p class="big">お便りありがとうございました！</p>
      <p>また次回のエピソードもお楽しみに。</p>
    </div>
  </div>
</main>

<!-- 裏送信用の非表示iframe -->
<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

<script>
  const form = document.getElementById('contactForm');
  const cloud = document.getElementById('cloud');
  const iframe = document.getElementById('hidden_iframe');
  const submitBtn = document.getElementById('submitBtn');
  let submitted = false;

  // 最初の空読み込み（iframe生成時）を無視し、実際の送信後の読み込みだけ拾う
  iframe.addEventListener('load', () => {
    if (!submitted) return;
    cloud.classList.add('is-sent');
  });

  form.addEventListener('submit', () => {
    submitted = true;
    submitBtn.disabled = true;
    submitBtn.textContent = '送信中…';
  });
</script>

<script src="nav.js"></script>
<script src="logo.js"></script>
</body>
</html>

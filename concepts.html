<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>概念一覧 | ラッキーもくもくチャンス</title>
  <meta name="description" content="番組で語られた概念（キーワード）の一覧。タグ済み・未タグで絞り込めます。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ラッキーもくもくチャンス">
  <meta property="og:title" content="概念一覧 | ラッキーもくもくチャンス">
  <meta property="og:description" content="番組で語られた概念（キーワード）の一覧。タグ済み・未タグで絞り込めます。">
  <meta property="og:url" content="https://luckymokumokuchance.github.io/podcast-graph/concepts.html">
  <meta property="og:image" content="https://luckymokumokuchance.github.io/podcast-graph/image/bg_mokumoku.webp">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://luckymokumokuchance.github.io/podcast-graph/concepts.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="concepts.css" />
</head>
<body>
  <div id="app">
    <!-- 説明（白カードで可読性を確保） -->
    <div class="page-intro">
      <h1>概念一覧</h1>
      <p>この番組で語られた概念の一覧です。タグとして整理した「タグ済み」と、まだ整理していない「未タグ」があります。下のボタンで絞り込めます。</p>
    </div>

    <!-- 検索＋フィルター -->
    <div id="search-cloud">
      <div id="search-row">
        <input id="search-input" type="search"
               placeholder="概念・エピソードから検索"
               autocomplete="off" aria-label="概念を検索">
        <button id="search-btn" aria-label="検索">Search</button>
      </div>
      <div id="filter-row" role="group" aria-label="タグの状態で絞り込み">
        <button class="filter-chip" data-filter="all"       aria-pressed="true">すべて</button>
        <button class="filter-chip" data-filter="tagged"    aria-pressed="false">タグ済み</button>
        <button class="filter-chip" data-filter="candidate" aria-pressed="false">未タグ</button>
      </div>
      <p id="result-count" role="status"></p>
    </div>

    <!-- 一覧 -->
    <div id="loading">preparing...</div>
    <div id="error" hidden>データの取得に失敗しました。時間をおいて再読み込みしてください。</div>
    <ul id="concept-list"></ul>
    <p id="empty" hidden>見つかりませんでした。ことばを変えてもう一度どうぞ。</p>
  </div>

  <script src="concepts.js"></script>
  <script src="nav.js"></script>
  <script src="logo.js"></script>
</body>
</html>

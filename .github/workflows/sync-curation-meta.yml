name: Sync curation meta

# スプレッドシートの概念・作品の手入力分（description/proposer/表紙画像等）を
# 定期的に app/concepts-meta.json / works-meta.json / images.json へ同期する。
#
# 2026-09-17 Phase2でRSSをDBにする設計に移行し、本文(shownote)の全文コピーは
# 廃止した（app/shownotes.json / sync-shownotes.yml は削除済み）。
# エピソード本文・タグ・作品は今はRSS(Spotifyの説明文)から毎回計算されるため
# 同期不要。ここで同期するのは「RSSでは表現しきれない手入力の付加情報」だけ：
#   - 概念の説明・提唱者・近接/対比概念（app/concepts-meta.json）
#   - 作品の表紙画像URL等（app/works-meta.json）
#   - 本文中の画像マップ（app/images.json）
#
# ⚠️ Step4（概念・作品の編集画面）を作ったら、このワークフローも役目を終える。
#    直接編集とポーリングの併用は、新しい編集を古いスプレッドシートの内容で
#    上書きする（LOGで同じ問題を踏んで廃止した実績あり）。
on:
  schedule:
    # 30分おき（GitHubの仕様上、実際の実行は数分〜十数分ずれることがある）
    - cron: '*/30 * * * *'
  # 「今すぐ反映したい」時にActionsタブから手動実行できる
  workflow_dispatch:

# 同時に複数走らないようにする（push衝突の防止）
concurrency:
  group: sync-curation-meta
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 生成したJSONをコミットするために必要

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/logo-deco

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 依存パッケージ(jsdom)をインストール
        run: npm install

      - name: 概念・作品の手入力分＋画像マップを取得
        run: node scripts/snapshot-curation-meta.mjs

      - name: 変化があればコミットしてpush
        run: |
          if git diff --quiet -- app/concepts-meta.json app/works-meta.json app/images.json; then
            echo "変化なし。コミットしません。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/concepts-meta.json app/works-meta.json app/images.json
          git commit -m "chore: sync curation meta from spreadsheet [skip ci]"
          git push origin HEAD:feature/logo-deco

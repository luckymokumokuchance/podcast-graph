name: Sync shownotes

# スプレッドシートのshownote（＋concepts/worksの手入力分）を定期的に
# app/shownotes.json / images.json / concepts-meta.json / works-meta.json へ同期する。
#
# なぜ必要か：
#   エピソードの「存在」はRSS由来なので新作は自動で星図に出るが、本文（＝タグ・
#   概念・作品の親）はスプレッドシート側にしかない。手動で npm run snapshot を
#   打つ運用は続かず、実際に2026-08-02〜08-12の10日間、2話ぶん陳腐化していた。
#   これを放置すると新エピソードが「本文なし・タグなし・概念/INSPIREDに出ない」
#   状態でしばらく公開されてしまう。
#
# ⚠️ Step 5（app/内にショーノート編集画面）を作ったら、このワークフローは
#    必ず削除すること。直接編集とポーリングを併用すると、新しい編集を古い
#    スプレッドシートの内容で上書きする（LOGで同じ問題を踏んで廃止した実績あり）。
on:
  schedule:
    # 30分おき（GitHubの仕様上、実際の実行は数分〜十数分ずれることがある）
    - cron: '*/30 * * * *'
  # 「今すぐ反映したい」時にActionsタブから手動実行できる
  workflow_dispatch:

# 同時に複数走らないようにする（push衝突の防止）
concurrency:
  group: sync-shownotes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 生成したJSONをコミットするために必要

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/logo-deco

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ショーノート・画像マップを取得
        run: node scripts/snapshot-shownotes.mjs

      - name: 概念・作品の手入力分を取得
        run: node scripts/snapshot-curation-meta.mjs

      - name: 変化があればコミットしてpush
        run: |
          if git diff --quiet -- app/shownotes.json app/images.json app/concepts-meta.json app/works-meta.json; then
            echo "変化なし。コミットしません。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/shownotes.json app/images.json app/concepts-meta.json app/works-meta.json
          git commit -m "chore: sync shownotes from spreadsheet [skip ci]"
          git push origin HEAD:feature/logo-deco

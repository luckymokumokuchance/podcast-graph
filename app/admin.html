<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>リンク登録 — 管理</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header class="abar">
    <span class="abrand">リンク登録</span>
    <div class="aright">
      <span id="who" class="who"></span>
      <button id="logout" class="btn ghost hidden">ログアウト</button>
      <a class="tostar" href="index.html">← 星図</a>
    </div>
  </header>

  <!-- ログイン前 -->
  <section id="gate" class="gate">
    <h2>合言葉を入力</h2>
    <p class="muted">管理者だけが知っている合言葉を入れてください。</p>
    <div class="tokrow">
      <input id="tok" type="password" placeholder="合言葉" autocomplete="off" />
      <button id="enter" class="btn primary">入る</button>
    </div>
    <p id="gate-msg" class="err"></p>
  </section>

  <!-- ログイン後 -->
  <main id="editor" class="editor hidden">
    <div class="toolbar">
      <div class="counts"><span id="cnt-links">0</span> 本のリンク / <span id="cnt-eps">0</span> エピソード</div>
      <div class="tbtns">
        <input id="filter" class="filter" type="search" placeholder="リンクを絞り込み（タイトル・理由）" />
        <button id="save" class="btn primary" disabled>保存（コミット）</button>
      </div>
    </div>
    <p id="save-msg" class="muted"></p>

    <section class="addcard">
      <h3>新しいリンクを追加</h3>
      <div class="addgrid">
        <label>起点
          <input id="add-source" list="ep-list" class="eppick" placeholder="話数かタイトルで検索" />
        </label>
        <span class="arrow">—</span>
        <label>終点
          <input id="add-target" list="ep-list" class="eppick" placeholder="話数かタイトルで検索" />
        </label>
        <label class="reasonlab">理由（任意）
          <input id="add-reason" type="text" placeholder="なぜつながるか" />
        </label>
        <button id="add" class="btn">追加</button>
      </div>
      <p id="add-msg" class="err"></p>
      <datalist id="ep-list"></datalist>
    </section>

    <h3 class="lh">登録済みリンク</h3>
    <div id="link-list" class="link-list"></div>
  </main>

  <script src="data.js"></script>
  <script src="admin.js"></script>
</body>
</html>

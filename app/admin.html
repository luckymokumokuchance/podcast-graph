<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理 — リンク編集</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">リンク編集（管理者）</span>
    <div style="margin-left:auto; display:flex; gap:10px; align-items:center;">
      <span id="who" class="who"></span>
      <button id="login" class="tab">GitHubでログイン</button>
      <button id="logout" class="tab hidden">ログアウト</button>
      <a class="adminlink" href="index.html">← 星図へ</a>
    </div>
  </header>

  <main class="admin-main">
    <div id="gate" class="gate">
      <p>リンク（エピソード同士のつながり）を編集します。</p>
      <p class="muted">保存にはこのリポジトリのコラボレーター権限が要ります。権限の無いアカウントは保存が拒否されます。</p>
    </div>

    <section id="editor" class="editor hidden">
      <h3>リンク一覧</h3>
      <table class="grid" id="link-table">
        <thead><tr><th>起点(話数)</th><th>終点(話数)</th><th>理由</th><th></th></tr></thead>
        <tbody></tbody>
      </table>

      <h3>新規追加</h3>
      <div class="addrow">
        <select id="add-source"></select>
        <span>→</span>
        <select id="add-target"></select>
        <input id="add-reason" type="text" placeholder="つながる理由" />
        <button id="add-btn" class="tab">追加</button>
      </div>

      <div class="saverow">
        <button id="save-btn" class="tab active">GitHubに保存（コミット）</button>
        <span id="save-status" class="muted"></span>
      </div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ラッキーもくもくチャンス</title>
  <link rel="stylesheet" href="graph.css" />
  <link rel="stylesheet" href="chrome.css" />
</head>
<body>
  <!-- ネットワーク（元の graph.js がそのまま描画） -->
  <div id="graph-container">
    <svg id="graph"></svg>
    <div id="tooltip" class="tooltip hidden"></div>
    <div id="loading">preparing...</div>
    <div id="legend"></div>

    <!-- スマホ用モーダル（元と同一構造） -->
    <div id="modal" class="modal hidden">
      <div id="modal-box">
        <button id="modal-close">✕</button>
        <p id="modal-ep"></p>
        <h2 id="modal-title"></h2>
        <a id="modal-link" href="#" target="_blank">Spotifyで聴く →</a>
        <p id="modal-summary"></p>
      </div>
    </div>

    <div id="color-panel"></div>

    <div id="controls">
      <div class="ctrl-row"><span class="ctrl-label">線の太さ</span><input class="ctrl-slider" id="s-stroke" type="range" min="0.2" max="4" step="0.1" value="1.2"><span class="ctrl-val" id="v-stroke">1.20</span></div>
      <div class="ctrl-row"><span class="ctrl-label">線の引力</span><input class="ctrl-slider" id="s-link" type="range" min="0" max="100" step="1" value="13"><span class="ctrl-val" id="v-link">13</span></div>
      <div class="ctrl-row"><span class="ctrl-label">散らばり</span><input class="ctrl-slider" id="s-charge" type="range" min="20" max="200" step="5" value="80"><span class="ctrl-val" id="v-charge">80</span></div>
      <div class="ctrl-row"><span class="ctrl-label">中心引力</span><input class="ctrl-slider" id="s-gravity" type="range" min="0" max="0.3" step="0.01" value="0.04"><span class="ctrl-val" id="v-gravity">0.04</span></div>
      <div class="ctrl-row"><span class="ctrl-label">デコ中心引力</span><input class="ctrl-slider" id="s-deco-gravity" type="range" min="0" max="1" step="0.05" value="0"><span class="ctrl-val" id="v-deco-gravity">0.00</span></div>
      <div class="ctrl-row"><span class="ctrl-label">デコ間隔のブレ</span><input class="ctrl-slider" id="s-deco-spread" type="range" min="0" max="1" step="0.05" value="0.55"><span class="ctrl-val" id="v-deco-spread">0.55</span></div>
      <div class="ctrl-row"><span class="ctrl-label">円のサイズ</span><input class="ctrl-slider" id="s-radius" type="range" min="12" max="56" step="1" value="21"><span class="ctrl-val" id="v-radius">21</span></div>
      <div class="ctrl-row"><span class="ctrl-label">番号サイズ</span><input class="ctrl-slider" id="s-ep-font" type="range" min="6" max="20" step="1" value="10"><span class="ctrl-val" id="v-ep-font">10</span></div>
      <div class="ctrl-row"><span class="ctrl-label">タイトルサイズ</span><input class="ctrl-slider" id="s-title-font" type="range" min="6" max="20" step="1" value="9"><span class="ctrl-val" id="v-title-font">9</span></div>
      <div class="ctrl-row"><span class="ctrl-label">文字消える倍率</span><input class="ctrl-slider" id="s-threshold" type="range" min="0.1" max="1.5" step="0.05" value="1.2"><span class="ctrl-val" id="v-threshold">1.20</span></div>
      <div class="ctrl-row"><span class="ctrl-label">回転速度</span><input class="ctrl-slider" id="s-rotate" type="range" min="0" max="30" step="0.5" value="2"><span class="ctrl-val" id="v-rotate">2.00</span></div>
      <div class="ctrl-row"><span class="ctrl-label">デコサイズ</span><input class="ctrl-slider" id="s-deco-size" type="range" min="1" max="12" step="0.5" value="3"><span class="ctrl-val" id="v-deco-size">3.00</span></div>
    </div>
  </div>

  <!-- 上部の浮遊トグル（アイコンのみ） -->
  <div class="viewtoggle">
    <button id="tab-network" class="vtab active" aria-label="ネットワーク">
      <svg viewBox="0 0 16 16" width="14" height="14"><g fill="none" stroke="currentColor" stroke-width="1.3"><line x1="4" y1="4" x2="11" y2="7"/><line x1="11" y1="7" x2="5" y2="12"/><line x1="4" y1="4" x2="5" y2="12"/></g><g fill="currentColor"><circle cx="4" cy="4" r="2"/><circle cx="11" cy="7" r="2"/><circle cx="5" cy="12" r="2"/></g></svg>
    </button>
    <button id="tab-table" class="vtab" aria-label="テーブル">
      <svg viewBox="0 0 16 16" width="14" height="14"><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="3" y1="4" x2="13" y2="4"/><line x1="3" y1="8" x2="13" y2="8"/><line x1="3" y1="12" x2="13" y2="12"/></g></svg>
    </button>
  </div>
  <a class="adminlink" href="admin.html" aria-label="管理">●</a>

  <script>window.GRAPH_ASSET_BASE = '../';</script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="data.js"></script>
  <script src="graph.js"></script>
  <script src="view.js"></script>
</body>
</html>

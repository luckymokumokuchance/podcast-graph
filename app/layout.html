<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>テーブルレイアウト調整 — 管理</title>
  <link rel="stylesheet" href="graph.css" />
  <link rel="stylesheet" href="chrome.css" />
  <link rel="stylesheet" href="layout.css" />
</head>
<body>
  <!-- 星図本体は常に通常サイズで描画（幅/高さを正しく測れるよう、ログイン前でも display:none にしない）。
       ログインするまでは #gate オーバーレイで覆って隠す。 -->
  <div id="graph-container">
    <svg id="graph"></svg>
    <div id="tooltip" class="tooltip hidden"></div>
    <div id="loading">preparing...</div>
    <div id="legend"></div>

    <div id="modal" class="modal hidden">
      <div id="modal-box">
        <button id="modal-close">✕</button>
        <p id="modal-ep"></p>
        <h2 id="modal-title"></h2>
        <a id="modal-link" href="#" target="_blank">Spotifyで聴く →</a>
        <p id="modal-summary"></p>
      </div>
    </div>

    <div id="color-panel"></div>

    <!-- graph.js起動時に読むだけのダミー値。この調整ページでは操作しない -->
    <div id="controls" style="display:none">
      <div class="ctrl-row"><input id="s-stroke" type="range" min="0.2" max="4" step="0.1" value="1.2"></div>
      <div class="ctrl-row"><input id="s-link" type="range" min="0" max="100" step="1" value="13"></div>
      <div class="ctrl-row"><input id="s-charge" type="range" min="20" max="200" step="5" value="80"></div>
      <div class="ctrl-row"><input id="s-gravity" type="range" min="0" max="0.3" step="0.01" value="0.04"></div>
      <div class="ctrl-row"><input id="s-deco-gravity" type="range" min="0" max="1" step="0.05" value="0"></div>
      <div class="ctrl-row"><input id="s-deco-spread" type="range" min="0" max="1" step="0.05" value="0.55"></div>
      <div class="ctrl-row"><input id="s-radius" type="range" min="12" max="56" step="1" value="21"></div>
      <div class="ctrl-row"><input id="s-ep-font" type="range" min="6" max="20" step="1" value="10"></div>
      <div class="ctrl-row"><input id="s-title-font" type="range" min="6" max="20" step="1" value="9"></div>
      <div class="ctrl-row"><input id="s-threshold" type="range" min="0.1" max="1.5" step="0.05" value="1.2"></div>
      <div class="ctrl-row"><input id="s-rotate" type="range" min="0" max="30" step="0.5" value="0"></div>
      <div class="ctrl-row"><input id="s-deco-size" type="range" min="1" max="12" step="0.5" value="3"></div>
    </div>
  </div>

  <!-- ログイン前オーバーレイ -->
  <section id="gate" class="lgate">
    <h2>合言葉を入力</h2>
    <p class="muted">管理者だけが知っている合言葉を入れてください。</p>
    <div class="tokrow">
      <input id="tok" type="password" placeholder="合言葉" autocomplete="off" />
      <button id="enter" class="btn primary">入る</button>
    </div>
    <p id="gate-msg" class="err"></p>
  </section>

  <!-- ログイン後の操作UI -->
  <div id="app" class="hidden">
    <header class="lbar">
      <span class="lbrand">テーブルレイアウト調整</span>
      <div class="lright">
        <span id="who" class="who"></span>
        <button id="save" class="btn primary" disabled>保存（コミット）</button>
        <a class="tostar" href="index.html">← 星図</a>
      </div>
    </header>
    <p id="save-msg" class="muted savemsg"></p>

    <div id="sliders" class="sliders">
      <div class="srow"><span class="slabel">行の高さ</span><input id="l-rowH" type="range" min="30" max="120" step="1"><span class="sval" id="v-rowH"></span></div>
      <div class="srow"><span class="slabel">左端の余白</span><input id="l-leftX" type="range" min="16" max="160" step="1"><span class="sval" id="v-leftX"></span></div>
      <div class="srow"><span class="slabel">丸の半径</span><input id="l-tableR" type="range" min="4" max="30" step="1"><span class="sval" id="v-tableR"></span></div>
      <div class="srow"><span class="slabel">丸→タイトルの距離</span><input id="l-titleX" type="range" min="4" max="60" step="1"><span class="sval" id="v-titleX"></span></div>
      <div class="srow"><span class="slabel">タイトル行の高さ</span><input id="l-titleH" type="range" min="10" max="70" step="1"><span class="sval" id="v-titleH"></span></div>
      <div class="srow"><span class="slabel">タイトルの文字サイズ</span><input id="l-titleFont" type="range" min="8" max="24" step="1"><span class="sval" id="v-titleFont"></span></div>
      <div class="srow"><span class="slabel">タイトルの文字の太さ</span><input id="l-titleWeight" type="range" min="100" max="900" step="100"><span class="sval" id="v-titleWeight"></span></div>
      <div class="srow"><span class="slabel">タイトルを省略する文字数</span><input id="l-titleTruncateLen" type="range" min="10" max="100" step="1"><span class="sval" id="v-titleTruncateLen"></span></div>
      <div class="srow"><span class="slabel">ショーノートの上下位置（丸の中心から）</span><input id="l-titleTagsGap" type="range" min="-20" max="60" step="1"><span class="sval" id="v-titleTagsGap"></span></div>
      <div class="srow"><span class="slabel">ショーノートの文字サイズ</span><input id="l-summaryFont" type="range" min="8" max="20" step="1"><span class="sval" id="v-summaryFont"></span></div>
      <div class="srow"><span class="slabel">ショーノートの文字数</span><input id="l-summaryLen" type="range" min="50" max="400" step="1"><span class="sval" id="v-summaryLen"></span></div>
      <div class="srow"><span class="slabel">ショーノートの高さ</span><input id="l-summaryH" type="range" min="10" max="120" step="1"><span class="sval" id="v-summaryH"></span></div>
      <div class="srow"><span class="slabel">タグの上下位置（丸の中心から）</span><input id="l-summaryTagsGap" type="range" min="0" max="112" step="1"><span class="sval" id="v-summaryTagsGap"></span></div>
      <div class="srow"><span class="slabel">タグの文字サイズ</span><input id="l-tagsFont" type="range" min="6" max="16" step="1"><span class="sval" id="v-tagsFont"></span></div>
      <div class="srow"><span class="slabel">タグ同士の間隔</span><input id="l-tagsGap" type="range" min="0" max="20" step="1"><span class="sval" id="v-tagsGap"></span></div>
      <div class="srow"><span class="slabel">一覧の上端の余白</span><input id="l-topPad" type="range" min="0" max="120" step="1"><span class="sval" id="v-topPad"></span></div>
      <div class="srow"><span class="slabel">一覧の右端の余白</span><input id="l-rightPad" type="range" min="0" max="60" step="1"><span class="sval" id="v-rightPad"></span></div>
      <div class="srow"><span class="slabel">一覧の下端の余白</span><input id="l-bottomPad" type="range" min="0" max="200" step="1"><span class="sval" id="v-bottomPad"></span></div>
    </div>
  </div>

  <script>window.GRAPH_ASSET_BASE = '../';</script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="data.js"></script>
  <script src="graph.js"></script>
  <script src="layout.js"></script>
</body>
</html>
